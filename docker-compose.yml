services:
  prefect:
    build: .
    image: ibm-hr-attrition
    container_name: ibm-hr-prefect
    command: prefect server start --host 0.0.0.0 --port 4200
    environment:
      - PREFECT_UI_API_URL=http://localhost:4200/api
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mlflow:
    build: .
    image: ibm-hr-attrition
    container_name: ibm-hr-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts mlflow:*,localhost:*,127.0.0.1:*
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  train:
    build: .
    image: ibm-hr-attrition
    container_name: ibm-hr-train
    environment:
      - PREFECT_API_URL=http://prefect:4200/api
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - train-data:/workspace
    depends_on:
      prefect:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  api:
    build: .
    image: ibm-hr-attrition
    container_name: ibm-hr-api
    command: uvicorn app:app --app-dir /app/02-Deployment/web-service --host 0.0.0.0 --port 8000
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - DB_PATH=/data/employees.db
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prefect-data:
  mlflow-data:
  train-data:
  api-data: 