[project]
name = "mlflow-ibm-hr-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laura Hoyos", email = "lauramh922@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "kagglehub>=1.0.2",
    "mlflow>=3.16.1",
    "openai>=3.16.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "prefect>=3.8.6",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[project.scripts]
mlflow-ibm-hr-analytics = "mlflow_ibm_hr_analytics:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
